# Copy to .github/workflows/ekc-impact.yml in the repository you want to analyse.
name: ekc-impact
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  blast-radius:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the diff needs the base commit
      - uses: per1215/enterprise-knowledge-context/.github/actions/ekc-impact@main
        with:
          fail-on: ''      # set to "high" to block risky changes
